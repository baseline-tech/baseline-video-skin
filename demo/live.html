<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baseline video skin: live</title>
    <style>
      body { margin: 0; padding: 24px; background: #111; font-family: system-ui, sans-serif; }
      main { max-width: 960px; margin: 0 auto; }

      /* Mirrors baseline-rails' VideoPlayerComponent for a match in play: the app's overrides and its LIVE badge. */
      .video-player {
        --media-accent-color: #03aa43;
        --media-accent-text-color: #fff;
        --media-font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        --media-border-radius: var(--video-player-radius, 0.25rem);
        position: relative; aspect-ratio: 16 / 9; overflow: clip; border-radius: 0.25rem; background: #101828;
      }
      .live-badge {
        position: absolute; left: 12px; top: 12px; z-index: 10; display: inline-flex; align-items: center; gap: 6px;
        border: 0; border-radius: 0.25rem; background: #dc2626; padding: 2px 8px; color: #fff; cursor: pointer;
        font: 600 12px/16px Inter, system-ui, sans-serif; letter-spacing: 0.025em; text-transform: uppercase;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1); transition: opacity 0.15s;
      }
      .live-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
      .live-badge:focus { outline: none; }
      .live-badge:focus-visible { box-shadow: 0 0 0 2px #fff; }
      .live-badge[data-behind] { opacity: 0.6; }
      .live-badge[data-idle] { pointer-events: none; opacity: 0 !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="video-player">
        <video-player style="display: block; width: 100%; height: 100%">
          <baseline-video-skin style="display: block; width: 100%; height: 100%">
            <hlsjs-video src="https://demo.unified-streaming.com/k8s/live/stable/live.isml/.m3u8"
                         autoplay muted playsinline preload="auto" style="display: block; width: 100%; height: 100%"></hlsjs-video>
          </baseline-video-skin>
        </video-player>
        <button type="button" class="live-badge" aria-label="Jump to live">Live</button>
      </div>
    </main>
    <script type="module" src="/demo/live.ts"></script>
  </body>
</html>
